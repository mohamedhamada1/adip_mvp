plan_tasks:
  - id: "T-1"
    text: "Scaffold Vite/React/TS + `@arcgis/core`; `src/scene/SceneRoot.tsx` instantiates `SceneView` with the tokenless Esri 3D Buildings SceneLayer (muted context) + emphasized project markers; dark cinematic tokens."
