    satisfies: ["AC-5"]
    tags: []
tests:
  - id: "TEST-1"
    text: "Component/render test asserts `SceneRoot` mounts a `SceneView` and adds the Esri 3D Buildings `SceneLayer`; a guard (`verify.sh` AC-1) asserts no raw hex color literal appears in any `*.tsx` component (hex only in `src/theme/*.css` tokens)."
    proves: ["AC-1"]
    fails_when: "SceneRoot renders without a SceneLayer (3D layer omitted), or a raw hex color is used in a component instead of a token."
  - id: "TEST-2"
    text: "Interaction test asserts a sector filter toggles visible markers and selecting a marker triggers a fly-to/emphasis call."
    proves: ["AC-2"]
    fails_when: "filter change leaves the marker set unchanged, or select does not call goTo."
  - id: "TEST-3"
    text: "AOI-switch test asserts the **`SceneView` instance is preserved** across a Khalifa↔Al Reem switch — the SceneView is constructed exactly once and the switch only updates its camera/layers (the app root is not remounted and there is no full-document-reload call such as `location.reload`/`location.href=`)."
    proves: ["AC-3"]
    fails_when: "switching AOI constructs a new SceneView, remounts the root, or triggers a full document reload (`location.reload`/`location.href=`) instead of updating the existing view."
  - id: "TEST-4"
    text: "Degrade test asserts disabling Al Reem yields a coherent Khalifa-only state and a simulated 3D-layer load failure swaps to the degrade path without reload; a guard (`verify.sh` AC-4) asserts no live-LLM / Assessment / Simulate / Ask-AI module reference exists anywhere in `src/`."
    proves: ["AC-4"]
    fails_when: "disabling Al Reem crashes/blanks the app, a layer failure forces a reload, or a forbidden module (LLM/Assessment/Simulate/Ask-AI) is referenced in src/."
  - id: "TEST-5"
    text: "Data guard asserts **every dataset module across ALL sources in `src/data/**` — both `.ts` and frozen `.json`** (synthetic portfolio AND AD-SDI-derived boundaries) carries a provenance tag (synthetic records also `IS_DEMO`), that KPI/count values are computed (no distinctive mockup budget literal `AED <n>B` appears in `src/`), and that an `Attribution` element renders."
    proves: ["AC-5"]
    fails_when: "any dataset module (`.ts` or `.json`) lacks a provenance tag, a synthetic record lacks `IS_DEMO`, a mockup budget literal (`AED <n>B`) appears in `src/`, or no attribution renders."
