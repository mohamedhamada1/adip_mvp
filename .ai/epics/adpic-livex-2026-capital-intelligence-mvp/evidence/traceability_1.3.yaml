acceptance_criteria:
  - id: "AC-1"
    text: "A pure-TypeScript, config-driven scoring engine deterministically produces a Low/Medium/High overall priority from configured indicator inputs and business rules; the SAME inputs always yield the SAME result (reproducible) (WORK-REQ-11, WORK-BR-3, WORK-CON-9)."
    covers: ["RR-1"]
    plan_tasks: ["T-1"]
    tests: ["TEST-1"]
    done_criteria: ["DC-1"]
  - id: "AC-2"
    text: "Each assessment result exposes the contributing per-dimension indicators/evidence (Strategic Alignment, Community Need, Spatial Service Gap, Duplication, Accessibility Benefit, Infrastructure Dependency, Delivery Complexity), not only the overall category (WORK-REQ-10, WORK-AC-6)."
    covers: ["RR-2"]
    plan_tasks: ["T-2"]
    tests: ["TEST-2"]
    done_criteria: ["DC-2"]
  - id: "AC-3"
    text: "The approved WORK-BR-15 disclaimer wording (\"Illustrative decision-support assessment for demonstration purposes; not an official project approval or investment decision.\") is persistently visible on the assessment screen (WORK-BR-15, WORK-AC-7)."
    covers: ["RR-3"]
    plan_tasks: ["T-3"]
    tests: ["TEST-3"]
    done_criteria: ["DC-3"]
  - id: "AC-4"
    text: "The overall result is attributed to deterministic GIS indicators + business rules; the UI visibly distinguishes calculated evidence from explanatory template text, and no screen presents AI as the approver/decider (WORK-BR-1, WORK-BR-2, WORK-SEC-7)."
    covers: ["RR-4"]
    plan_tasks: ["T-4"]
    tests: ["TEST-4"]
    done_criteria: ["DC-4"]
  - id: "AC-5"
    text: "The configurable scoring weights are labeled exhibition-only / illustrative and NOT presented as an official ADPIC methodology unless separately validated (WORK-BR-9, WORK-BR-10)."
    covers: ["RR-5"]
    plan_tasks: ["T-5"]
    tests: ["TEST-5"]
    done_criteria: ["DC-5"]
  - id: "AC-6"
    text: "A missing indicator input yields a defined, evidence-visible outcome (the dimension is marked \"Insufficient data\" with the reason) rather than an invented score, and the overall priority remains deterministic (WORK-NFR-11 traceability; derived edge-case requirement)."
    covers: ["RR-6"]
    plan_tasks: ["T-6"]
    tests: ["TEST-6"]
    done_criteria: ["DC-6"]
  - id: "AC-7"
    text: "The assessment is REACHABLE from Explore: selecting a project and choosing Evaluate opens the Assessment for THAT project and renders its deterministic result — the engine and screen are actually WIRED into the app flow, not shipped unreachable (roadmap Success Proof \"selecting a planned project yields a reproducible Low/Medium/High\"; WORK-UX-5, WORK-REQ-9)."
    covers: ["RR-1"]
    plan_tasks: ["T-7"]
    tests: ["TEST-7"]
    done_criteria: ["DC-7"]
plan_tasks:
  - id: "T-1"
    text: "Build the pure, config-driven `scoringEngine.ts` + `weights.config.ts` + `indicators.ts` producing deterministic Low/Med/High from inputs+rules (no random/clock/network)."
    satisfies: ["AC-1"]
    tags: []
  - id: "T-2"
    text: "Emit per-dimension evidence in every result and render the dimension table with evidence on the Assessment screen."
    satisfies: ["AC-2"]
    tags: []
  - id: "T-3"
    text: "Add the exact WORK-BR-15 disclaimer constant and render it persistently on the Assessment screen."
    satisfies: ["AC-3"]
    tags: []
  - id: "T-4"
    text: "Attribute the overall result to GIS/rules, separate explanation from evidence, and ensure no AI-as-approver phrasing (tokens only, no live LLM)."
    satisfies: ["AC-4"]
    tags: []
  - id: "T-5"
    text: "Label the weights config illustrative / not-official-ADPIC-methodology and surface that note near the dimensions."
    satisfies: ["AC-5"]
    tags: []
  - id: "T-6"
    text: "Handle a missing indicator input as an \"Insufficient data\" dimension with a reason, keeping the overall priority deterministic via exclude-and-renormalize."
    satisfies: ["AC-6"]
    tags: []
  - id: "T-7"
    text: "Extract `AppShell` (injected `SceneApi`) and wire Explore→Evaluate so selecting a project opens the Assessment for that project; `App.tsx` becomes the thin `@arcgis/core` wrapper."
    satisfies: ["AC-7"]
    tags: []
tests:
  - id: "TEST-1"
    text: "Determinism/banding test calls `scoreProject` twice on the same input and asserts deeply-equal results, and asserts a high-profile input bands High while a low-profile input bands Low."
    proves: ["AC-1"]
    fails_when: "two runs on identical input differ, or the engine references Math.random/Date/fetch (purity), or banding is inverted."
  - id: "TEST-2"
    text: "Evidence test asserts every present-input dimension result has a non-empty `evidence` array and the Assessment renders those evidence items."
    proves: ["AC-2"]
    fails_when: "a dimension returns a score with empty evidence, or the UI shows only the category with no evidence."
  - id: "TEST-3"
    text: "Disclaimer test asserts the Assessment renders the EXACT WORK-BR-15 string."
    proves: ["AC-3"]
    fails_when: "the disclaimer text is absent or altered."
  - id: "TEST-4"
    text: "Authority test asserts the result exposes `attributedTo` = GIS/rules, the UI renders a rules-attribution label, explanation is tagged separately from evidence, and there is no \"AI approves/recommends approval/decision\" phrasing."
    proves: ["AC-4"]
    fails_when: "the UI presents AI as approving/deciding, or explanation is indistinguishable from calculated evidence."
  - id: "TEST-5"
    text: "Weights-label test asserts the weights config exposes the \"illustrative / not official ADPIC methodology\" label and the UI surfaces it."
    proves: ["AC-5"]
    fails_when: "weights are presented without the non-official label."
  - id: "TEST-6"
    text: "Missing-input test scores a project with ONE removed indicator (affected dimension band \"Insufficient data\" + reason + no numeric score; overall still a deterministic Low/Med/High via exclude-and-renormalize) AND a project with ALL indicators removed (overall = \"Insufficient data\", overallScore null — no invented score)."
    proves: ["AC-6"]
    fails_when: "a missing input produces an invented numeric score, the all-missing case yields a numeric band instead of \"Insufficient data\", or the overall is non-deterministic/NaN."
  - id: "TEST-7"
    text: "Integration test renders `AppShell` with an injected fake `SceneApi` (no @arcgis/core), selects a project, activates Evaluate, and asserts the Assessment renders for THAT project (its name + a Low/Med/High result + the disclaimer); then goes Back to Explore and asserts the mounted view is PRESERVED — `fakeSceneApi.createView` was called exactly once across the whole Explore→Evaluate→Back cycle and `view.destroy` was not called."
    proves: ["AC-7"]
    fails_when: "selecting a project + Evaluate does not open the Assessment, the Assessment is not wired into AppShell (shippable unreachable), OR Evaluate/Back destroys and recreates the SceneView (createView called more than once, or destroy called on Back)."
